name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'naqsh-negar-source.zip'
      - 'source-overlay/**'
      - 'source-overlay-b64/**'
      - 'scripts/restore-overlay.sh'
      - '.github/workflows/android-apk.yml'
      - '.github/actions/validate-source/action.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check source archive
        run: test -f naqsh-negar-source.zip

      - name: Extract project and apply upgrade overlay
        run: |
          mkdir -p "$RUNNER_TEMP/naqsh-negar"
          unzip -q naqsh-negar-source.zip -d "$RUNNER_TEMP/naqsh-negar"
          bash scripts/restore-overlay.sh
          test -f "$RUNNER_TEMP/naqsh-negar/naqsh-negar/package.json"
          node source-overlay/apply-overlay.mjs "$RUNNER_TEMP/naqsh-negar/naqsh-negar"
          echo "PROJECT_DIR=$RUNNER_TEMP/naqsh-negar/naqsh-negar" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate source
        uses: ./.github/actions/validate-source
        with:
          project-dir: ${{ env.PROJECT_DIR }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies and build
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          npm ci
          npm run build

      - name: Sync Android
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap sync android

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: naqsh-negar-debug-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
