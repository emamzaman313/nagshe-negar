name: Validate Naghsh Negar source
description: Run dependency-free validation tests included in the checked-in source archive and social overlay
inputs:
  project-dir:
    description: Absolute path to the extracted Naghsh Negar project
    required: true
runs:
  using: composite
  steps:
    - name: Check required project files
      shell: bash
      working-directory: ${{ inputs.project-dir }}
      run: |
        test -f package.json
        test -f package-lock.json
        test -f src/app/SocialPage.tsx
        test -f src/app/social.css
        test -f src/app/SocialModerationAdminPage.tsx
        test -f src/app/AdminSocialModerationShortcut.tsx
        test -f src/app/social-moderation-admin.css
        test -f src/app/MusicPlayer.tsx
        test -f src/app/MusicAdminPage.tsx
        test -f src/app/AdminMusicShortcut.tsx
        test -f src/app/AdminUsersPage.tsx
        test -f src/app/AdminUsersShortcut.tsx
        test -f src/app/admin-users.css
        test -f supabase/migrations/20261126171000_qnr_admin_user_role_management.sql
        test -f src/app/music.css
        test -f src/lib/music-validation.ts
        test -f supabase/migrations/20261126170000_qnr_music_admin_library.sql
        test -f supabase/migrations/20261126110000_admin_social_moderation_workflow.sql
        test -f supabase/migrations/20261126111500_harden_social_moderation_inputs.sql
        test -f supabase/migrations/20261126113000_move_social_moderation_rpc_to_private_schema.sql
        test -f supabase/migrations/20261126103808_qnr_social_admin_media_read.sql
        test -f supabase/migrations/20261126093000_qnr_social_network.sql
        test -f supabase/migrations/20261126095938_qnr_social_metrics_security_and_indexes.sql
        test -f supabase/migrations/20261126100341_qnr_social_acl_hardening.sql
        test -f supabase/functions/create-order/order-lines.test.ts
        test -f supabase/functions/_shared/gallery-validation.test.ts
        test -f supabase/functions/_shared/chat-validation.test.ts
        test -f supabase/functions/_shared/social-validation.test.ts
        grep -q 'admin/social-moderation' src/app/App.tsx
        grep -q 'qnr_admin_moderate_social_content' src/app/SocialModerationAdminPage.tsx
        grep -q 'AdminSocialModerationShortcut' src/app/App.tsx
        grep -q 'onAuthStateChange' src/app/AdminSocialModerationShortcut.tsx
        grep -q 'qnr_music_platform_settings' src/app/MusicPlayer.tsx
        grep -q 'qnr_music_tracks' src/app/MusicAdminPage.tsx
        grep -q 'MusicPlayer' src/app/App.tsx
        grep -q 'admin/music' src/app/App.tsx
        grep -q 'admin/users' src/app/App.tsx
        grep -q 'qnr_admin_set_user_role' src/app/AdminUsersPage.tsx
        grep -q 'ریلز' src/app/SocialModerationAdminPage.tsx
        grep -q 'تأیید ریلز' src/app/SocialModerationAdminPage.tsx
    - name: Audit existing pages, styles and interactions before visual changes
      shell: bash
      working-directory: ${{ inputs.project-dir }}
      run: |
        node <<'NODE'
        const fs = require('node:fs');
        const path = require('node:path');
        const files = [];
        function walk(dir) {
          for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
            if (['node_modules', 'dist', '.git', 'android'].includes(entry.name)) continue;
            const full = path.join(dir, entry.name);
            if (entry.isDirectory()) walk(full);
            else if (/\\.(tsx?|jsx?|css|scss)$/.test(entry.name)) files.push(full);
          }
        }
        walk('src');
        const source = files.filter(f => /\\.(tsx?|jsx?)$/.test(f)).map(f => fs.readFileSync(f, 'utf8')).join('\\n');
        const styles = files.filter(f => /\\.(css|scss)$/.test(f)).map(f => fs.readFileSync(f, 'utf8')).join('\\n');
        const collect = (regex, text) => [...text.matchAll(regex)].map(m => m[1]);
        const routes = [...new Set(collect(/<Route\\b[^>]*\\bpath=["']([^"']+)/g, source))].sort();
        const classes = [...new Set(collect(/\\.([a-zA-Z_][\\w-]*)/g, styles).filter(x => /(profile|avatar|cover|rank|badge|chat|message|reel|feed|nav|card|button|theme)/i.test(x)))].sort();
        const breakpoints = [...new Set(collect(/@media\\s*\\((?:max|min)-width\\s*:\\s*([^)]+)/g, styles))].sort();
        const keyframes = [...new Set(collect(/@keyframes\\s+([\\w-]+)/g, styles))].sort();
        const tokens = [...new Set(collect(/(--[\\w-]+)\\s*:/g, styles))].sort();
        const touch = [...new Set(collect(/(onPointer(?:Down|Move|Up|Cancel)|onTouch(?:Start|Move|End)|touch-action|pointercapture|swipe|drag)/gi, source + '\\n' + styles))].sort();
        console.log('VISUAL_AUDIT ' + JSON.stringify({
          sourceFiles: files.length,
          routePaths: routes,
          relevantCssClasses: classes,
          responsiveBreakpoints: breakpoints,
          keyframes,
          designTokens: tokens,
          touchAndPointerHooks: touch,
          reducedMotion: /prefers-reduced-motion/.test(styles + source),
          themeSwitching: /(theme-light|dark-mode|data-theme|setTheme|toggleTheme)/i.test(source + styles)
        }, null, 2));
        NODE
    - name: Run dependency-free validation tests
      shell: bash
      working-directory: ${{ inputs.project-dir }}
      run: |
        node --experimental-strip-types --test supabase/functions/create-order/order-lines.test.ts
        node --experimental-strip-types --test supabase/functions/_shared/gallery-validation.test.ts
        node --experimental-strip-types --test supabase/functions/_shared/chat-validation.test.ts
        node --experimental-strip-types --test supabase/functions/_shared/social-validation.test.ts
        node --experimental-strip-types --test supabase/functions/_shared/music-validation.test.ts
